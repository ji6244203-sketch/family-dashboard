<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="우리 가족 보드" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#FBF4E8" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="거실 태블릿에 띄워 두는 우리 가족 대시보드 — 오늘 날짜와 전주 날씨, 설 등원 체크리스트, 가족 일정, 한 줄 메모." />
<title>우리 가족 보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238FAA86'/%3E%3Cpath d='M22 52L50 26L78 52V79H60V62H40V79H22Z' fill='%23FFFDF6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   우리 가족 보드 — 거실 태블릿용 가족 대시보드
   · 외부 빌드 없음, 단일 파일
   · 개인정보 없음 / 모든 기록은 이 기기의 localStorage 에만 저장
   · 날씨: Open-Meteo (전주)
   ============================================================ */
:root{
  --cream-0:#FFFDF8;
  --cream-1:#FBF4E8;
  --cream-2:#F2E7D5;
  --cream-3:#E8DAC3;
  --sage-1:#EAF1E5;
  --sage-2:#CFE0C6;
  --sage-3:#8FAA86;
  --sage-deep:#5F7C5B;
  --sage-ink:#48624A;
  --peach-1:#FBE7DA;
  --peach-2:#F3C7AD;
  --peach-3:#DD9A78;
  --peach-ink:#8E5637;
  --butter-1:#FAEECB;
  --butter-2:#EBD49B;
  --butter-ink:#8A6B2E;
  --ink:#3D3831;
  --ink-2:#6A6155;
  --muted:#9C9284;
  --line:#EDE2D0;
  --card:#FFFCF6;
  --shadow:0 14px 30px -18px rgba(92,76,50,.35), 0 2px 8px rgba(92,76,50,.05);
  --radius:26px;
  --pad:clamp(14px, 1.7vh, 22px);
  --gap:clamp(10px, 1.4vh, 18px);
}

*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(70% 46% at 6% 0%, #FDEBDA 0%, rgba(253,235,218,0) 64%),
    radial-gradient(62% 44% at 98% 4%, #E6EEDC 0%, rgba(230,238,220,0) 62%),
    radial-gradient(70% 60% at 50% 108%, #F7E9D3 0%, rgba(247,233,211,0) 60%),
    linear-gradient(172deg,#FFFDF7 0%,#FBF4E7 46%,#F7EEDD 100%);
  background-attachment:fixed;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;}
button:active{transform:scale(.98);}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
h1,h2,h3{margin:0;font-weight:400;}

/* ---------- 전체 틀 ---------- */
.app{
  width:100%;
  max-width:1560px;
  margin:0 auto;
  padding:var(--pad) clamp(12px, 1.6vw, 26px);
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  min-height:100dvh;
}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  min-height:0;
}
.card{min-height:0;}

/* 가로(태블릿 1280x800): 스크롤 없이 한 화면 */
@media (orientation:landscape) and (min-width:960px){
  .app{height:100dvh; overflow:hidden;}
  .cards{flex:1 1 auto; grid-template-rows:minmax(0,1fr);}
  .card{overflow:hidden;}
  body{overflow:hidden;}
}
@media (orientation:portrait), (max-width:959px){
  .cards{grid-template-columns:1fr;}
  body{overflow-y:auto;}
}

/* ---------- 카드 공통 ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ---------- 상단 헤더 ---------- */
.top{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:clamp(12px,2vw,30px);
  padding:clamp(12px,1.6vh,20px) clamp(16px,2vw,28px);
  background:
    linear-gradient(120deg, #FFFDF7 0%, #FFF8EC 52%, #F3F0E4 100%);
}
.clock{display:flex;flex-direction:column;gap:2px;min-width:0;}
.time{
  font-family:"Jua","Gowun Dodum",sans-serif;
  font-size:clamp(46px, 7.4vh, 76px);
  line-height:.94;
  letter-spacing:-.01em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.date{
  font-size:clamp(16px, 2.55vh, 23px);
  color:var(--ink-2);
  letter-spacing:.01em;
}

.weather{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:clamp(8px,1.2vw,16px);
  min-width:0;
  text-align:right;
}
.w-now{display:flex;align-items:center;gap:6px;}
.w-ico{font-size:clamp(30px,4.6vh,46px);line-height:1;}
.w-temp{
  font-family:"Jua",sans-serif;
  font-size:clamp(32px,5.2vh,52px);
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.w-meta{display:flex;flex-direction:column;gap:1px;min-width:0;align-items:flex-start;text-align:left;}
.w-ump{align-self:flex-start;}
.w-loc{font-size:clamp(14px,2.1vh,19px);color:var(--ink-2);}
.w-loc b{color:var(--sage-ink);font-weight:700;}
.w-minmax{font-size:clamp(14px,2.1vh,19px);color:var(--ink-2);font-variant-numeric:tabular-nums;}
.w-ump{
  font-size:clamp(14px,2.05vh,18px);
  color:var(--sage-ink);
  background:var(--sage-1);
  border-radius:999px;
  padding:2px 10px;
  margin-top:3px;
  white-space:nowrap;
}
.w-ump.warn{color:var(--peach-ink);background:var(--peach-1);}
.w-ump.plain{color:var(--muted);background:transparent;padding:2px 0;}

/* 날씨를 못 가져왔을 때: 아이콘·기온 자리를 비우고 문구만 조용히 */
.weather.is-fallback .w-now{display:none;}
.weather.is-fallback .w-loc{color:var(--muted);font-weight:400;}
.weather.is-fallback .w-loc b{color:var(--muted);font-weight:400;}
.weather.is-fallback .w-minmax{color:#B6A995;font-size:clamp(12px,1.8vh,15px);}

/* 세로 좁은 화면 */
@media (max-width:860px){
  .top{grid-template-columns:1fr;gap:10px;}
  .clock{grid-column:1;}
  .weather{
    grid-column:1 / -1;
    order:3;
    justify-content:flex-start;
    text-align:left;
    border-top:1px dashed var(--cream-2);
    padding-top:10px;
  }
  .w-meta{align-items:flex-start;}
}

/* 아주 좁은 화면(폰)에서는 체크리스트를 1열로 */
@media (max-width:420px){
  #chkList{grid-template-columns:1fr;}
}

/* ---------- 카드 머리 ---------- */
.card-body{
  display:flex;flex-direction:column;min-height:0;
  padding:clamp(12px,1.6vh,20px) clamp(14px,1.5vw,22px);
  gap:clamp(8px,1.1vh,13px);
  height:100%;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-title{
  font-family:"Jua",sans-serif;
  font-size:clamp(19px,2.95vh,28px);
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
  letter-spacing:-.01em;
}
.count{
  font-size:clamp(15px,2.2vh,20px);
  color:var(--sage-ink);
  background:var(--sage-1);
  border-radius:999px;
  padding:4px 13px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* ---------- 체크리스트 ---------- */
.bar{
  height:clamp(10px,1.5vh,14px);
  border-radius:999px;
  background:var(--cream-2);
  overflow:hidden;
  flex:0 0 auto;
}
.bar > i{
  display:block;height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--peach-2),var(--sage-3));
  transition:width .45s cubic-bezier(.3,.9,.3,1);
}
.celebrate{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(100deg,var(--sage-1),#F7F2DF 60%,var(--peach-1));
  border:1px solid #DCE7D2;
  border-radius:18px;
  padding:10px 14px;
  font-size:clamp(15px,2.2vh,20px);
  color:var(--sage-ink);
  animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;
}
.celebrate .spark{font-size:1.25em;animation:spin 3s linear infinite;display:inline-block;}
@keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes spin{from{transform:rotate(-8deg);}50%{transform:rotate(8deg);}to{transform:rotate(-8deg);}}

.list{
  list-style:none;margin:0;padding:1px 0;
  display:flex;flex-direction:column;gap:clamp(6px,.9vh,10px);
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--cream-3) transparent;
}
.list::-webkit-scrollbar{width:8px;}
.list::-webkit-scrollbar-thumb{background:var(--cream-3);border-radius:99px;}

/* 등원 체크리스트: 그림 큰 2열(4행×2열) 카드 타일 — 글자를 못 읽어도 그림으로 알아보게 */
#chkList{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-auto-rows:1fr;
  gap:clamp(7px,1vh,12px);
  align-items:stretch;
}
#chkList .empty{grid-column:1 / -1;}
.chk{
  position:relative;
  display:flex;align-items:stretch;
  border-radius:20px;
  padding:clamp(8px,1.1vh,14px) clamp(8px,1vw,14px);
  background:#FFFDF7;
  border:1px solid var(--line);
  transition:background .2s,border-color .2s;
  min-height:clamp(56px,8.5vh,96px);
}
.chk-main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(3px,.5vh,7px);
  flex:1 1 auto;min-width:0;text-align:center;
  padding:2px 26px 2px 2px;
}
.chk-ico{
  flex:0 0 auto;
  font-size:clamp(30px,5.4vh,50px);
  line-height:1;
  filter:drop-shadow(0 3px 4px rgba(92,76,50,.16));
  transition:transform .18s,filter .18s;
}
.chk-text{
  font-size:clamp(15px,2.35vh,20px);
  line-height:1.22;
  color:var(--ink);
  word-break:keep-all;
  transition:color .2s;
}
/* 완료 표시는 타일 왼쪽 위 작은 배지로 */
.chk-box{
  position:absolute;top:8px;left:8px;
  flex:0 0 auto;
  width:clamp(26px,3.2vh,32px);height:clamp(26px,3.2vh,32px);
  border-radius:50%;
  border:2px solid var(--sage-2);
  background:#fff;
  display:grid;place-items:center;
  transition:background .18s,border-color .18s,transform .18s;
}
.chk-box .tick{font-size:clamp(15px,2vh,20px);color:#fff;line-height:1;opacity:0;transform:scale(.5);transition:opacity .18s,transform .18s;}
.chk.done{background:var(--sage-1);border-color:#DDE8D4;}
.chk.done .chk-ico{transform:scale(.92);}
.chk.done .chk-box{background:var(--sage-3);border-color:var(--sage-3);}
.chk.done .chk-box .tick{opacity:1;transform:scale(1);}
.chk.done .chk-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#C9BDA9;}

/* 삭제 버튼은 타일 오른쪽 위에 조그맣게 */
.del{
  position:absolute;top:6px;right:6px;
  flex:0 0 auto;
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  color:#C4B7A3;font-size:15px;line-height:1;
  background:transparent;
  transition:background .18s,color .18s;
}
.del:hover{background:#FBEDE6;color:var(--peach-ink);}

/* 완료 배너가 뜨면 타일이 조금 촘촘해진다(그리드가 알아서 줄여 준다) */
.celebrate:not([hidden]) ~ .list{gap:5px;}
.celebrate:not([hidden]) ~ .list .chk-ico{font-size:clamp(26px,4.6vh,42px);}

/* 브라우저 바가 높이를 줄인 태블릿(예: 1280x720)에서도 8개 타일이 들어가게 */
@media (orientation:landscape) and (max-height:760px) and (min-width:960px){
  #chkList{gap:4px;}
  .chk{padding:4px 10px;}
  .chk-ico{font-size:clamp(24px,4.4vh,38px);}
  .chk-text{font-size:clamp(13px,2.1vh,17px);}
  .chk-box{width:24px;height:24px;}
  .chk-box .tick{font-size:14px;}
}

.card-foot{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;}
.btn{
  min-height:52px;
  padding:0 18px;
  border-radius:16px;
  font-size:clamp(15px,2.05vh,18px);
  background:var(--cream-1);
  border:1px solid var(--line);
  color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s;
}
.btn:hover{background:#F6EEDF;}
.btn.solid{background:var(--sage-3);border-color:var(--sage-3);color:#fff;}
.btn.solid:hover{background:var(--sage-deep);}
.btn.grow{flex:1 1 auto;justify-content:center;}

.add-row{
  display:flex;gap:8px;align-items:center;
  padding:6px;
  border-radius:18px;
  background:var(--cream-1);
  border:1px dashed var(--cream-3);
  animation:pop .25s ease both;
}
.add-row input{
  flex:1 1 auto;min-width:0;height:50px;
  border-radius:12px;border:1.5px solid var(--line);
  background:#fff;padding:0 14px;
  font-size:clamp(16px,2.4vh,20px);
}

/* ---------- 일정 ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.fchip{
  min-height:44px;padding:0 14px;border-radius:999px;
  font-size:clamp(14px,1.95vh,17px);
  background:#FFFDF7;border:1.5px solid var(--line);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
  transition:background .18s,border-color .18s,color .18s;
}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5;}
.fchip.on{background:var(--sage-1);border-color:var(--sage-2);color:var(--sage-ink);font-weight:700;}
.fchip.on .dot{opacity:1;}

.ev{
  display:flex;align-items:center;gap:clamp(6px,.8vw,10px);
  background:#FFFDF7;
  border:1px solid var(--line);
  border-left:6px solid var(--evc,var(--sage-2));
  border-radius:18px;
  padding:clamp(7px,1vh,11px) clamp(8px,1vw,12px);
  transition:opacity .2s,background .2s,border-color .2s;
}
.ev:hover{border-color:#E4D8C6;}
.ev.who-seol{--evc:var(--peach-2);}
.ev.who-mom{--evc:#A9C6A2;}
.ev.who-dad{--evc:var(--butter-2);}
.ev.who-all{--evc:#D8CBB6;}
.ev-time{
  flex:0 0 auto;
  font-family:"Jua",sans-serif;
  font-size:clamp(17px,2.5vh,23px);
  color:var(--ink);
  background:var(--cream-1);
  border:1px solid transparent;
  border-radius:12px;
  padding:6px 9px;
  min-width:clamp(62px,5.6vw,80px);
  text-align:center;
  font-variant-numeric:tabular-nums;
  transition:background .18s,border-color .18s;
}
.ev-time:hover{background:#F6EEDF;border-color:var(--cream-3);}
.ev-main{
  flex:1 1 auto;min-width:0;text-align:left;
  display:flex;flex-direction:column;gap:3px;
  min-height:48px;justify-content:center;
}
.ev-title{
  font-size:clamp(17px,2.75vh,25px);
  color:var(--ink);line-height:1.2;word-break:keep-all;
}
.ev-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{
  font-size:clamp(11px,1.6vh,14px);
  padding:2px 9px;border-radius:999px;
  background:var(--cream-1);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:4px;
}
.tag.t-seol{background:var(--peach-1);color:var(--peach-ink);}
.tag.t-mom{background:var(--sage-1);color:var(--sage-ink);}
.tag.t-dad{background:var(--butter-1);color:var(--butter-ink);}
.tag.t-all{background:var(--cream-1);color:var(--ink-2);}
.tag.t-rep{background:#F2EEE4;color:var(--muted);}
/* 오른쪽 조작 버튼 묶음: 수정(✎) · 완료(✓) · 삭제(✕) — 태블릿에서 손가락으로 바로 누르게 크게 */
.ev-tools{
  flex:0 0 auto;
  display:flex;align-items:center;gap:clamp(4px,.5vw,7px);
}
.ev-done{
  flex:0 0 auto;
  width:clamp(44px,5.4vh,50px);height:clamp(44px,5.4vh,50px);
  border-radius:50%;
  border:2.5px solid var(--sage-2);
  background:#fff;display:grid;place-items:center;
  transition:background .18s,border-color .18s;
}
.ev-edit,.ev-del{
  flex:0 0 auto;
  width:clamp(40px,4.9vh,46px);height:clamp(40px,4.9vh,46px);
  border-radius:50%;
  display:grid;place-items:center;
  line-height:1;
  border:1.5px solid transparent;
  transition:background .18s,border-color .18s,color .18s;
}
.ev-edit{
  font-size:clamp(19px,2.5vh,23px);
  color:var(--sage-deep);
  background:var(--sage-1);
  border-color:#D6E3CB;
}
.ev-edit:hover{background:#DFEAD5;border-color:var(--sage-2);}
.ev-del{
  font-size:clamp(21px,2.8vh,26px);
  font-weight:700;
  color:var(--peach-ink);
  background:#FBEFE6;
  border-color:#EFD6C4;
  margin-left:2px;
}
.ev-del svg{display:block;width:clamp(15px,1.95vh,18px);height:clamp(15px,1.95vh,18px);}
.ev-del:hover{background:#F7E0D1;border-color:var(--peach-2);color:#7C462B;}
.ev-done .tick{font-size:clamp(20px,2.8vh,26px);color:var(--sage-2);opacity:.5;transition:opacity .18s,color .18s;line-height:1;}
.ev.done{background:var(--sage-1);}
.ev.done .ev-time{background:#E4EEDC;color:var(--sage-ink);}
.ev.done .ev-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#C9BDA9;}
.ev.done .ev-done{background:var(--sage-3);border-color:var(--sage-3);}
.ev.done .ev-done .tick{opacity:1;color:#fff;}
.ev.done .ev-edit{background:#EDF3E7;border-color:#DDE8D4;}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:110px;
  color:var(--muted);
  font-size:clamp(15px,2.2vh,19px);
  line-height:1.5;
  border:1px dashed var(--cream-3);
  border-radius:18px;
  background:#FFFDF8;
  text-align:center;
  padding:14px;
}
.empty .empty-ico{font-size:clamp(26px,3.6vh,34px);line-height:1;opacity:.85;}
#schList .empty{flex:1 1 auto;}

/* ---------- 메모 ---------- */
.memo-bar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:clamp(10px,1.2vw,16px);
  padding:clamp(10px,1.4vh,16px) clamp(16px,2vw,24px);
  background:linear-gradient(100deg,#FFFDF6,#FFF7E9 55%,#F6F2E3);
  cursor:text;
}
.memo-label{
  flex:0 0 auto;
  font-family:"Jua",sans-serif;
  font-size:clamp(16px,2.35vh,21px);
  color:var(--sage-ink);
  display:flex;align-items:center;gap:7px;
  border-right:1px dashed var(--cream-3);
  padding-right:clamp(10px,1.2vw,16px);
  align-self:stretch;
  max-width:42%;
}
.memo{
  flex:1 1 auto;min-width:0;
  font-size:clamp(17px,2.9vh,25px);
  color:var(--ink);
  min-height:44px;
  display:flex;align-items:center;
  padding:6px 12px;
  border-radius:14px;
  outline:none;
  word-break:break-word;
  transition:background .18s,box-shadow .18s;
}
.memo:empty::before{content:attr(data-ph);color:#BDAF9B;}
.memo:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--sage-2);}
.memo .saved{color:var(--muted);}

@media (max-width:860px){
  .memo-bar{flex-direction:column;align-items:stretch;gap:4px;}
  .memo-label{border-right:0;border-bottom:1px dashed var(--cream-3);padding:0 0 6px;max-width:none;}
  .memo{min-height:52px;font-size:19px;}
}

/* ---------- 추가 시트 ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;
  background:rgba(62,52,38,.34);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  animation:fade .18s ease both;
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:min(560px,100%);
  background:var(--cream-0);
  border-radius:28px;
  box-shadow:0 30px 70px -24px rgba(60,48,32,.55);
  padding:clamp(18px,2.4vw,28px);
  display:flex;flex-direction:column;gap:14px;
  max-height:calc(100dvh - 32px);
  overflow-y:auto;
  animation:pop .22s cubic-bezier(.2,1.2,.4,1) both;
}
.sheet h2{font-family:"Jua",sans-serif;font-size:24px;color:var(--ink);}
.field{display:flex;flex-direction:column;gap:6px;}
.field > label{font-size:14px;color:var(--muted);padding-left:4px;}
.sheet input[type=text],.sheet input[type=time]{
  height:58px;border-radius:16px;border:1.5px solid var(--line);
  background:#fff;padding:0 16px;font-size:20px;color:var(--ink);width:100%;
}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--sage-2);outline-offset:1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg{display:flex;gap:8px;}
.seg button{
  flex:1;min-height:54px;border-radius:16px;
  border:1.5px solid var(--line);background:#fff;
  font-size:17px;color:var(--ink-2);
}
.seg button.on{background:var(--sage-1);border-color:var(--sage-2);color:var(--sage-ink);font-weight:700;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chips button{
  min-height:52px;padding:0 18px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff;
  font-size:17px;color:var(--ink-2);
}
.chips button.on[data-who="전체"]{background:#F1EADC;border-color:#E0D4C0;color:var(--ink);font-weight:700;}
.chips button.on[data-who="설"]{background:var(--peach-1);border-color:var(--peach-2);color:var(--peach-ink);font-weight:700;}
.chips button.on[data-who="엄마"]{background:var(--sage-1);border-color:var(--sage-2);color:var(--sage-ink);font-weight:700;}
.chips button.on[data-who="아빠"]{background:var(--butter-1);border-color:var(--butter-2);color:var(--butter-ink);font-weight:700;}
.sheet-foot{display:flex;gap:10px;margin-top:2px;}
.sheet-foot .cancel{flex:0 0 34%;}
.sheet-foot .save{flex:1;background:var(--sage-3);border-color:var(--sage-3);color:#fff;font-weight:700;}
.btn.danger{
  justify-content:center;
  background:#FBEFE6;border-color:#F2DCCC;color:var(--peach-ink);
}
.btn.danger:hover{background:#F7E0D1;border-color:var(--peach-2);}
.shake{animation:shake .3s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;z-index:90;
  transform:translate(-50%,20px);
  display:flex;align-items:center;gap:14px;
  background:#4A443A;color:#FFF9EF;
  padding:14px 18px;border-radius:18px;
  font-size:16px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{
  min-height:44px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,.14);color:#FFF3E0;font-size:15px;white-space:nowrap;
}

/* ---------- 접근성 ---------- */
:focus-visible{outline:2.5px solid var(--sage-3);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 헤더: 시계 · 날짜 · 전주 날씨 ===== -->
  <header class="top card">
    <div class="clock">
      <div class="time" id="clock">--:--</div>

    <!-- 오른쪽: 가족 일정 -->
    <section class="card" aria-labelledby="schTitle">
      <div class="card-body">
        <div class="card-head">
          <h2 class="card-title" id="schTitle">📅 오늘의 가족 일정</h2>
          <div class="filters" id="filters" role="group" aria-label="구성원 필터">

            <button class="fchip" data-filter="설"><span class="dot"></span>설</button>
            <button class="fchip" data-filter="엄마"><span class="dot"></span>엄마</button>
            <button class="fchip" data-filter="아빠"><span class="dot"></span>아빠</button>
          </div>

        <ul class="list" id="schList" aria-live="polite"></ul>

  </div>

  <!-- ===== 하단 메모 ===== -->
  <footer class="memo-bar card">
    <div class="memo-label">🍲 오늘 저녁 메뉴 <span style="opacity:.6">·</span> 한 줄 메모</div>
    <div class="memo" id="memo" contenteditable="true" role="textbox" aria-multiline="false"
         aria-label="가족 한 줄 메모" data-ph="탭해서 오늘의 한 줄을 남겨 보세요 (예: 저녁은 김치찌개 🍲)"></div>
  </footer>

</div>

<!-- ===== 일정 추가 / 수정 시트 (같은 시트를 두 모드로 씀) ===== -->
<div class="overlay" id="schOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="schFormTitle">
    <h2 id="schFormTitle">일정 추가</h2>

    <div class="row2">
      <div class="field">
        <label for="evTime">시간</label>
        <input type="time" id="evTime" value="09:00" />
      </div>
      <div class="field">
        <label>반복</label>
        <div class="seg" id="evRepeat">
          <button type="button" data-rep="once" class="on">오늘만</button>
          <button type="button" data-rep="daily">매일 반복</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="evTitle">무엇을 하나요?</label>
      <input type="text" id="evTitle" placeholder="예: 설 어린이집 상담" maxlength="40" enterkeyhint="done" />
    </div>

    <div class="field">
      <label>누구 일정인가요?</label>
      <div class="chips" id="evWho">
        <button type="button" data-who="전체" class="on">전체</button>
        <button type="button" data-who="설">설</button>

      <button type="button" class="btn cancel" id="evCancel">취소</button>
      <button type="button" class="btn save" id="evSave">저장</button>
    </div>

    <button type="button" class="btn danger" id="evDelete" hidden>🗑 이 일정 지우기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============================================================
   1. 기본 설정
   ============================================================ */
const TZ = 'Asia/Seoul';
const KEY = 'family-dashboard.v1';
/* 체크리스트 기본 항목 — 그림(이모지)과 함께 저장한다 */
const CL_VERSION = 2;
const DEFAULT_CHECK = [
  { text: '화장실가기(소변)', icon: '🚽' },
  { text: '아침식사', icon: '🥣' },
  { text: '영양제', icon: '💊' },
  { text: '양치질', icon: '🪥' },
  { text: '세수', icon: '🧼' },
  { text: '로션', icon: '🧴' },
  { text: '옷갈아입기', icon: '👕' },
  { text: '가방챙기기', icon: '🎒' }
];
/* 일정 저장 규칙 버전 — 예전 버전이 첫 방문에 넣어 두던 예시 일정을 걷어 낼 때 올린다 */
const SCHED_VERSION = 2;
/* 예전 버전(freshState)이 넣어 두던 기본 예시 일정 — 이제는 넣지 않는다.
   이미 열어 본 기기에서는 아래 시간·제목·구성원·반복이 모두 같은 항목만 지운다
   (직접 고치거나 새로 추가한 일정은 그대로 둔다). */
const OLD_DEFAULT_EVENTS = [
  { time: '08:30', title: '설 등원', who: '설', repeat: 'daily' },
  { time: '16:00', title: '설 하원', who: '설', repeat: 'daily' }
];
/* 예전(v1) 기본 항목 — 이것들로 저장된 기기는 새 8개 항목으로 자동 전환 */
const OLD_DEFAULT_TEXTS = [
  '양치·세수하기',
  '옷 입기 & 겉옷 챙기기',
  '물통·수저통 챙기기',
  '여벌옷·손수건 확인',
  '알림장 확인하기'
];
/* 항목 이름에 맞는 그림 찾기 (새로 추가하는 항목에도 기본 그림이 붙도록) */
const ICON_HINTS = [
  [/화장실|소변|대변|변기/, '🚽'], [/식사|밥|아침|저녁/, '🥣'], [/영양제|비타민|약/, '💊'],
  [/양치|칫솔/, '🪥'], [/세수|손.*씻|세면/, '🧼'], [/로션|크림|선크림|바르/, '🧴'],
  [/옷|갈아입|겉옷|잠옷/, '👕'], [/가방|준비물|책가방/, '🎒'],
  [/물통|물마시기|물 마시|물마심/, '🥤'], [/간식|과자|우유/, '🍪'],
  [/마스크|손수건/, '😷'], [/알림장|책|공책|읽기/, '📓'],
  [/모자|목도리|장갑/, '🧢'], [/우산/, '☂️'],
  [/양말|신발/, '🧦'], [/머리|빗질/, '🪮'],
  [/장난감|인형/, '🧸']
];
const FALLBACK_ICON = '⭐';
function iconFor(text) {
  const t = String(text);
  const hit = ICON_HINTS.find(([re]) => re.test(t));
  return hit ? hit[1] : FALLBACK_ICON;
}
const WHO_KEY = { '전체': 'all', '설': 'seol', '엄마': 'mom', '아빠': 'dad' };

const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=35.8714&longitude=127.1293'
  + '&current=temperature_2m,weather_code'
  + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
  + '&timezone=Asia%2FSeoul';

/* ============================================================
   2. 작은 도구들
   ============================================================ */
const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** 한국 시간 기준 오늘 날짜 키 (YYYY-MM-DD) */
function todayKey() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}
function nowParts() {
  const d = new Date();
  /* 시·분을 한 번에 뽑아야 분이 한 자리일 때도 '04'처럼 0이 붙는다
     (분만 지정하면 ICU가 '4'로 돌려준다) */
  const tf = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  });
  const parts = tf.formatToParts(d);
  const pick = (type) => (parts.find((p) => p.type === type) || {}).value || '00';
  const hh = pick('hour').padStart(2, '0');
  const mm = pick('minute').padStart(2, '0');
  const dateText = new Intl.DateTimeFormat('ko-KR', {
    timeZone: TZ, month: 'long', day: 'numeric', weekday: 'long'
  }).format(d);
  return { hh, mm, dateText, hour: Number(hh) };
}

/* ============================================================
   3. 저장소 / 상태
   ============================================================ */
function freshState() {
  const t = todayKey();
  return {
    v: 1,
    clVersion: CL_VERSION,
    schedVersion: SCHED_VERSION,
    checklist: {
      date: t,
      items: DEFAULT_CHECK.map((d) => ({ id: uid(), text: d.text, icon: d.icon, done: false }))
    },
    /* 첫 방문에는 일정을 비워 둔다 — 직접 등록한 일정만 보이게 */
    schedule: [],
    memo: '',
    filter: '전체'
  };
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
  if (!raw || typeof raw !== 'object') return freshState();

  // 예전/깨진 저장값 보정
  const s = freshState();
  /* 이 기기에 남아 있던 예전 이름('이설이'/'이설') 기록을 '설'로 옮긴다 */
  const renameChild = (t) => String(t).replace(/이설이/g, '설').replace(/이설/g, '설');
  raw.checklist = raw.checklist && Array.isArray(raw.checklist.items) ? raw.checklist : s.checklist;
  raw.schedule = Array.isArray(raw.schedule) ? raw.schedule : s.schedule;
  raw.checklist.items = raw.checklist.items.filter((i) => i && typeof i.text === 'string')
    .map((i) => ({ id: i.id || uid(), text: String(i.text).slice(0, 40), icon: typeof i.icon === 'string' && i.icon ? i.icon.slice(0, 8) : iconFor(i.text), done: !!i.done }));
  /* v1(그림 없는 5개 기본 항목) → v2(그림 있는 8개 기본 항목) 자동 전환.
     v1 기본 항목은 걷어 내고, 직접 추가했던 항목(예전 기본 항목에 없던 것)은
     기본 그림을 붙여 새 8개 뒤에 그대로 남긴다. */
  const ver = Number.isFinite(raw.clVersion) ? raw.clVersion : 1;
  if (ver < CL_VERSION) {
    const kept = raw.checklist.items.filter((i) => !OLD_DEFAULT_TEXTS.includes(i.text));
    raw.checklist.items = DEFAULT_CHECK.map((d) => ({ id: uid(), text: d.text, icon: d.icon, done: false }))
      .concat(kept.map((i) => ({ ...i, icon: i.icon || iconFor(i.text) })));
  }
  raw.clVersion = CL_VERSION;
  raw.schedule = raw.schedule.filter((e) => e && typeof e.title === 'string')
    .map((e) => ({
      id: e.id || uid(),
      time: /^\d{2}:\d{2}$/.test(e.time) ? e.time : '09:00',
      title: renameChild(String(e.title)).slice(0, 40),
      who: e.who === '이설' ? '설' : (['전체','설','엄마','아빠'].includes(e.who) ? e.who : '전체'),
      repeat: e.repeat === 'daily' ? 'daily' : 'once',
      date: e.repeat === 'daily' ? null : (e.date || todayKey()),
      doneOn: e.doneOn || null
    }));
  /* 일정 마이그레이션: 예전 버전이 기본으로 넣어 둔 '설 등원'/'설 하원' 을 한 번만 걷어 낸다.
     사용자가 직접 추가·수정한 다른 일정은 손대지 않는다. */
  const schedVer = Number.isFinite(raw.schedVersion) ? raw.schedVersion : 1;
  if (schedVer < SCHED_VERSION) {
    raw.schedule = raw.schedule.filter((e) => !OLD_DEFAULT_EVENTS.some((d) =>
      e.title === d.title && e.time === d.time && e.who === d.who && e.repeat === d.repeat));
  }
  raw.schedVersion = SCHED_VERSION;
  raw.memo = typeof raw.memo === 'string' ? raw.memo : '';
  raw.filter = raw.filter === '이설' ? '설' : (['전체','설','엄마','아빠'].includes(raw.filter) ? raw.filter : '전체');
  return raw;
}

let S = loadState();

/* 체크리스트·일정 마이그레이션 등 저장값 규칙이 바뀌었으면 바로 기록해 둔다
   (날짜가 바뀐 게 아니면 rollover() 가 저장하지 않아 매번 다시 전환하게 된다) */
try {
  const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (!stored || stored.clVersion !== CL_VERSION || stored.schedVersion !== SCHED_VERSION) save();
} catch (e) { save(); }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장 실패는 조용히 */ }
}

/** 날짜가 바뀌면: 체크 초기화 · 지난 '오늘만' 일정 정리 · 반복 일정 체크 해제 */
function rollover() {
  const t = todayKey();
  let changed = false;

  if (!S.checklist.date) { S.checklist.date = t; changed = true; }
  if (S.checklist.date !== t) {
    S.checklist.date = t;
    S.checklist.items.forEach((i) => { i.done = false; });
    changed = true;
  }

  const before = S.schedule.length;
  S.schedule = S.schedule.filter((e) => e.repeat === 'daily' || (e.date && e.date >= t));
  if (S.schedule.length !== before) changed = true;

  S.schedule.forEach((e) => {
    if (e.repeat === 'daily' && e.doneOn !== t) { e.doneOn = null; changed = true; }
    if (e.repeat === 'once' && !e.date) { e.date = t; changed = true; }
  });

  if (changed) save();
  return changed;
}

/* ============================================================
   4. 시계 · 날씨
   ============================================================ */
function renderClock() {
  const { hh, mm, dateText } = nowParts();
  const clockEl = $('clock');
  const t = hh + ':' + mm;
  if (clockEl.textContent !== t) clockEl.textContent = t;
  if ($('date').textContent !== dateText) $('date').textContent = dateText;
}

const WEATHER_TEXT = {
  0: ['☀️', '맑음'], 1: ['🌤️', '대체로 맑음'], 2: ['⛅', '구름 조금'], 3: ['☁️', '흐림'],
  45: ['🌫️', '안개'], 48: ['🌫️', '짙은 안개'],
  51: ['🌦️', '약한 이슬비'], 53: ['🌦️', '이슬비'], 55: ['🌦️', '강한 이슬비'],
  56: ['🌧️', '어는 이슬비'], 57: ['🌧️', '어는 이슬비'],
  61: ['🌧️', '약한 비'], 63: ['🌧️', '비'], 65: ['🌧️', '강한 비'],
  66: ['🌧️', '어는 비'], 67: ['🌧️', '어는 비'],
  71: ['❄️', '약한 눈'], 73: ['❄️', '눈'], 75: ['❄️', '강한 눈'], 77: ['🌨️', '눈 날림'],
  80: ['🌦️', '약한 소나기'], 81: ['🌧️', '소나기'], 82: ['⛈️', '강한 소나기'],
  85: ['🌨️', '눈 소나기'], 86: ['🌨️', '강한 눈 소나기'],
  95: ['⛈️', '천둥번개'], 96: ['⛈️', '우박 동반 뇌우'], 99: ['⛈️', '강한 뇌우']
};
const RAIN_CODES = new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]);
const SNOW_CODES = new Set([71,73,75,77,85,86]);
const round1 = (v) => Math.round(Number(v));

let weatherTimer = null;

function weatherFallback() {
  const w = $('weather');
  w.classList.add('is-fallback');
  $('wIco').textContent = '';
  $('wTemp').textContent = '';
  $('wCond').textContent = '날씨를 불러오지 못했어요';
  $('wMinMax').textContent = '잠시 후 다시 확인할게요';
  const u = $('wUmp');
  u.hidden = true;
  u.textContent = '';
}

async function loadWeather() {
  clearTimeout(weatherTimer);
  try {
    const ctrl = new AbortController();
    const kill = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(WEATHER_URL, { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(kill);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const cur = d.current || {};
    if (cur.temperature_2m == null) throw new Error('no current');

    const code = Number(cur.weather_code);
    const [ico, cond] = WEATHER_TEXT[code] || ['🌡️', '날씨'];
    const day = (d.daily || {});
    const tmax = Array.isArray(day.temperature_2m_max) ? day.temperature_2m_max[0] : null;
    const tmin = Array.isArray(day.temperature_2m_min) ? day.temperature_2m_min[0] : null;
    const pop = Array.isArray(day.precipitation_probability_max) ? day.precipitation_probability_max[0] : null;

    $('weather').classList.remove('is-fallback');
    $('wIco').textContent = ico;
    $('wTemp').textContent = round1(cur.temperature_2m) + '°';
    $('wCond').textContent = cond;
    $('wMinMax').textContent = '최저 ' + (tmin != null ? round1(tmin) + '°' : '–°')
      + ' · 최고 ' + (tmax != null ? round1(tmax) + '°' : '–°');

    const u = $('wUmp');
    u.hidden = false;
    let msg, cls = 'w-ump';
    if (RAIN_CODES.has(code)) { msg = '☂ 비 와요 · 우산 챙기세요'; cls += ' warn'; }
    else if (SNOW_CODES.has(code)) { msg = '❄️ 눈 와요 · 길 조심'; cls += ' warn'; }
    else if (pop != null && pop >= 60) { msg = '☂ 강수 ' + pop + '% · 우산 챙기면 좋아요'; cls += ' warn'; }
    else if (pop != null) { msg = '강수 ' + pop + '% · 비 소식 없어요'; }
    else { msg = '강수 정보 없음'; cls += ' plain'; }
    u.textContent = msg;
    u.className = cls;
  } catch (e) {
    weatherFallback();
  } finally {
    weatherTimer = setTimeout(loadWeather, 15 * 60 * 1000); // 15분마다 갱신
  }
}

/* ============================================================
   5. 체크리스트
   ============================================================ */
function renderChecklist() {
  const items = S.checklist.items;
  const done = items.filter((i) => i.done).length;
  const total = items.length;

  $('chkCount').textContent = done + ' / ' + total;
  $('chkBar').style.width = total ? Math.round((done / total) * 100) + '%' : '0%';

  const list = $('chkList');
  if (!total) {
    list.innerHTML = '<li class="empty">아직 항목이 없어요. 아래에서 추가해 보세요.</li>';
  } else {
    list.innerHTML = items.map((i) => `
      <li class="chk${i.done ? ' done' : ''}" data-id="${esc(i.id)}">
        <button class="chk-main" role="checkbox" aria-checked="${i.done}" aria-label="${esc(i.text)}">
          <span class="chk-ico" aria-hidden="true">${esc(i.icon || iconFor(i.text))}</span>
          <span class="chk-text">${esc(i.text)}</span>
          <span class="chk-box" aria-hidden="true"><span class="tick">✓</span></span>
        </button>
        <button class="del" aria-label="${esc(i.text)} 삭제" data-act="del-chk">✕</button>
      </li>`).join('');
  }

  const allDone = total > 0 && done === total;
  $('celebrate').hidden = !allDone;
}

function toggleChk(id) {
  const it = S.checklist.items.find((i) => i.id === id);
  if (!it) return;
  it.done = !it.done;
  save();
  renderChecklist();
}

function resetToday() {
  const snapshot = S.checklist.items.map((i) => i.done);
  if (!snapshot.some(Boolean)) { toast('오늘 체크는 이미 비어 있어요'); return; }
  S.checklist.items.forEach((i) => { i.done = false; });
  save();
  renderChecklist();
  toast('오늘 체크를 모두 지웠어요', {
    label: '되돌리기',
    run: () => {
      S.checklist.items.forEach((i, idx) => { i.done = !!snapshot[idx]; });
      save();
      renderChecklist();
    }
  });
}

function deleteChk(id) {
  const idx = S.checklist.items.findIndex((i) => i.id === id);
  if (idx < 0) return;
  const [removed] = S.checklist.items.splice(idx, 1);
  save();
  renderChecklist();
  toast('“' + removed.text + '” 항목을 지웠어요', {
    label: '되돌리기',
    run: () => {
      S.checklist.items.splice(Math.min(idx, S.checklist.items.length), 0, removed);
      save();
      renderChecklist();
    }
  });
}

function openAddRow() {
  $('chkAddRow').hidden = false;
  $('chkAddBtn').hidden = true;
  const inp = $('chkAddInput');
  inp.value = '';
  setTimeout(() => inp.focus(), 30);
}

function closeAddRow() {
  $('chkAddRow').hidden = true;
  $('chkAddBtn').hidden = false;
  $('chkAddInput').value = '';
}

function addChk() {
  const inp = $('chkAddInput');
  const text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  S.checklist.items.push({ id: uid(), text: text.slice(0, 40), icon: iconFor(text), done: false });
  save();
  renderChecklist();
  inp.value = '';
  inp.focus();
  $('chkList').scrollTop = $('chkList').scrollHeight;
}

/* ============================================================
   6. 가족 일정
   ============================================================ */
function visibleSchedule() {
  const t = todayKey();
  return S.schedule
    .filter((e) => e.repeat === 'daily' || e.date === t)
    .filter((e) => S.filter === '전체' || e.who === S.filter || e.who === '전체')
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}

function renderSchedule() {
  const t = todayKey();
  const list = $('schList');
  const rows = visibleSchedule();

  document.querySelectorAll('#filters .fchip').forEach((b) => {
    b.classList.toggle('on', b.dataset.filter === S.filter);
  });

  if (!rows.length) {
    list.innerHTML = S.schedule.length
      ? '<li class="empty">이 구성원의 일정은 아직 없어요</li>'
      : '<li class="empty"><span class="empty-ico">🗓</span>오늘 일정이 아직 없어요.<br>아래 ＋ 일정 추가로 등록해 보세요</li>';
    return;
  }

  list.innerHTML = rows.map((e) => {
    const done = e.doneOn === t;
    const whoCls = WHO_KEY[e.who] || 'all';
    return `
      <li class="ev who-${whoCls}${done ? ' done' : ''}" data-id="${esc(e.id)}">
        <button class="ev-time" data-act="edit-ev" aria-label="${esc(e.time)} ${esc(e.title)} 일정 수정">${esc(e.time)}</button>
        <button class="ev-main" data-act="edit-ev" aria-label="${esc(e.title)} 일정 수정">
          <span class="ev-title">${esc(e.title)}</span>
          <span class="ev-tags">
            <span class="tag t-${whoCls}">${esc(e.who)}</span>
            ${e.repeat === 'daily' ? '<span class="tag t-rep">매일</span>' : ''}
          </span>
        </button>
        <div class="ev-tools">
          <button class="ev-edit" data-act="edit-ev" aria-label="${esc(e.title)} 수정">✏️</button>
          <button class="ev-done" aria-pressed="${done}" aria-label="${esc(e.title)} 완료 표시"><span class="tick">✓</span></button>
          <button class="ev-del" data-act="del-ev" aria-label="${esc(e.title)} 삭제"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </li>`;
  }).join('');
}

function toggleEv(id) {
  const e = S.schedule.find((x) => x.id === id);
  if (!e) return;
  const t = todayKey();
  e.doneOn = e.doneOn === t ? null : t;
  save();
  renderSchedule();
}

function deleteEv(id) {
  const idx = S.schedule.findIndex((x) => x.id === id);
  if (idx < 0) return;
  const [removed] = S.schedule.splice(idx, 1);
  save();
  renderSchedule();
  toast('“' + removed.title + '” 일정을 지웠어요', {
    label: '되돌리기',
    run: () => {
      S.schedule.splice(Math.min(idx, S.schedule.length), 0, removed);
      save();
      renderSchedule();
    }
  });
}

/* --- 일정 추가 / 수정 시트 (한 시트를 두 모드로) --- */
let sheetMode = 'add';   // 'add' | 'edit'
let editId = null;
let draftWho = '전체';
let draftRep = 'once';

function syncDraftChips() {
  document.querySelectorAll('#evWho button').forEach((b) => b.classList.toggle('on', b.dataset.who === draftWho));
  document.querySelectorAll('#evRepeat button').forEach((b) => b.classList.toggle('on', b.dataset.rep === draftRep));
}

/** ev 를 주면 그 일정을 고치는 "일정 수정" 모드로 연다 */
function openSheet(ev) {
  const editing = !!ev && typeof ev === 'object' && !!ev.id;
  sheetMode = editing ? 'edit' : 'add';
  editId = editing ? ev.id : null;
  $('schFormTitle').textContent = editing ? '일정 수정' : '일정 추가';
  $('evDelete').hidden = !editing;

  if (editing) {
    $('evTime').value = ev.time;
    $('evTitle').value = ev.title;
    draftWho = ev.who;
    draftRep = ev.repeat;
  } else {
    const { hour } = nowParts();
    $('evTime').value = String(Math.min(23, hour + 1)).padStart(2, '0') + ':00';
    $('evTitle').value = '';
    draftWho = '전체';
    draftRep = 'once';
  }
  syncDraftChips();
  $('schOverlay').hidden = false;
  if (!editing) setTimeout(() => $('evTitle').focus(), 60);
}
function closeSheet() {
  $('schOverlay').hidden = true;
  sheetMode = 'add';
  editId = null;
}

/** 지금 건 일정이 화면에서 사라지지 않도록(필터에 가리지 않도록) 필터를 풀어 준다 */
function keepVisible(who) {
  if (S.filter !== '전체' && who !== S.filter && who !== '전체') {
    S.filter = '전체';
    save();
  }
}

function saveEvent() {
  const title = $('evTitle').value.trim();
  const time = $('evTime').value || '09:00';
  if (!title) {
    const f = $('evTitle');
    f.classList.add('shake');
    f.focus();
    setTimeout(() => f.classList.remove('shake'), 350);
    return;
  }

  if (sheetMode === 'edit') {
    const e = S.schedule.find((x) => x.id === editId);
    if (!e) { closeSheet(); renderSchedule(); return; }
    const before = { ...e };
    const repChanged = e.repeat !== draftRep;
    e.time = time;
    e.title = title.slice(0, 40);
    e.who = draftWho;
    e.repeat = draftRep;
    e.date = draftRep === 'daily' ? null : (e.date || todayKey());
    if (repChanged) e.doneOn = null;
    save();
    keepVisible(e.who);
    renderSchedule();
    closeSheet();
    toast('일정을 수정했어요', {
      label: '되돌리기',
      run: () => {
        const cur = S.schedule.find((x) => x.id === before.id);
        if (!cur) return;
        Object.assign(cur, before);
        save();
        renderSchedule();
      }
    });
    return;
  }

  S.schedule.push({
    id: uid(),
    time,
    title: title.slice(0, 40),
    who: draftWho,
    repeat: draftRep,
    date: draftRep === 'daily' ? null : todayKey(),
    doneOn: null
  });
  save();
  keepVisible(draftWho);
  renderSchedule();
  closeSheet();
  toast('일정을 추가했어요');
}

/** 시트 안의 "이 일정 지우기" */
function deleteFromSheet() {
  const id = editId;
  if (!id) return;
  closeSheet();
  deleteEv(id);
}

/* ============================================================
   7. 메모
   ============================================================ */
let memoTimer = null;
function renderMemo() {
  const el = $('memo');
  if (el.textContent !== S.memo) el.textContent = S.memo;
}
function initMemo() {
  const el = $('memo');
  renderMemo();
  el.addEventListener('input', () => {
    S.memo = el.textContent.replace(/\s+/g, ' ').trim().slice(0, 120);
    clearTimeout(memoTimer);
    memoTimer = setTimeout(save, 400);
  });
  el.addEventListener('blur', () => { S.memo = el.textContent.replace(/\s+/g, ' ').trim().slice(0, 120); el.textContent = S.memo; save(); });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); save(); }
  });
  document.querySelector('.memo-bar').addEventListener('click', (e) => {
    if (e.target === el) return;
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  });
}

/* ============================================================
   8. 토스트
   ============================================================ */
let toastTimer = null;
function toast(msg, action) {
  const el = $('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>';
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = action.label;
    b.addEventListener('click', () => { action.run(); hideToast(); });
    el.appendChild(b);
  }
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6500);
}
function hideToast() {
  const el = $('toast');
  el.classList.remove('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 250);
}

/* ============================================================
   9. 이벤트 연결
   ============================================================ */
function bind() {
  // 체크리스트
  $('chkList').addEventListener('click', (e) => {
    const row = e.target.closest('.chk');
    if (!row) return;
    const id = row.dataset.id;
    if (e.target.closest('[data-act="del-chk"]')) { deleteChk(id); return; }
    if (e.target.closest('.chk-main')) toggleChk(id);
  });
  $('chkAddBtn').addEventListener('click', openAddRow);
  $('chkAddCancel').addEventListener('click', closeAddRow);
  $('chkAddOk').addEventListener('click', addChk);
  $('chkAddInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addChk(); }
    if (e.key === 'Escape') closeAddRow();
  });
  $('chkReset').addEventListener('click', resetToday);

  // 일정: 카드의 시간·제목을 탭하거나 ✎ 을 누르면 수정 시트가 열린다
  $('schList').addEventListener('click', (e) => {
    const row = e.target.closest('.ev');
    if (!row) return;
    const id = row.dataset.id;
    if (e.target.closest('[data-act="del-ev"]')) { deleteEv(id); return; }
    if (e.target.closest('[data-act="edit-ev"]')) {
      const ev = S.schedule.find((x) => x.id === id);
      if (ev) openSheet(ev);
      return;
    }
    if (e.target.closest('.ev-done')) toggleEv(id);
  });
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('.fchip');
    if (!b) return;
    S.filter = b.dataset.filter;
    save();
    renderSchedule();
  });
  $('schAddBtn').addEventListener('click', () => openSheet());
  $('evCancel').addEventListener('click', closeSheet);
  $('evSave').addEventListener('click', saveEvent);
  $('evDelete').addEventListener('click', deleteFromSheet);
  $('evTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEvent(); } });
  $('schOverlay').addEventListener('click', (e) => { if (e.target === $('schOverlay')) closeSheet(); });
  $('evWho').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-who]');
    if (!b) return;
    draftWho = b.dataset.who;
    document.querySelectorAll('#evWho button').forEach((x) => x.classList.toggle('on', x === b));
  });
  $('evRepeat').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-rep]');
    if (!b) return;
    draftRep = b.dataset.rep;
    document.querySelectorAll('#evRepeat button').forEach((x) => x.classList.toggle('on', x === b));
  });

  // Escape 로 열린 시트·입력줄 닫기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSheet(); closeAddRow(); }
  });

  // 화면 복귀 시 갱신
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      renderClock();
      if (rollover()) { renderChecklist(); renderSchedule(); }
      loadWeather();
    }
  });
}

/* ============================================================
   10. 시작
   ============================================================ */
function renderAll() {
  renderChecklist();
  renderSchedule();
  renderMemo();
}

function boot() {
  rollover();
  renderClock();
  renderAll();
  initMemo();
  bind();
  loadWeather();

  setInterval(renderClock, 1000);
  setInterval(() => {
    if (rollover()) {
      renderChecklist();
      renderSchedule();
      toast('날이 바뀌어서 오늘 준비를 새로 시작해요');
    }
  }, 30 * 1000);
}

boot();
